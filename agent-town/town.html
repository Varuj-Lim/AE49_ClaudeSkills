<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Town</title>
<style>
  :root{--hud:#0f1720cc;--ink:#eef3f7;--muted:#a9b6c2;--accent:#6aa8de;--good:#5cc08a;--warn:#e2ac43;--bad:#e8705c}
  html,body{margin:0;height:100%;background:#9fc6e6;overflow:hidden;font-family:"Sarabun",ui-sans-serif,system-ui,sans-serif}
  canvas{display:block}
  .hud{position:fixed;left:8px;right:8px;pointer-events:none;color:var(--ink);font-size:12px}
  .top{top:8px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .pill{background:var(--hud);border-radius:8px;padding:6px 9px;backdrop-filter:blur(3px)}
  .title{font-weight:700;letter-spacing:.04em}
  .mode{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}
  .bottom{bottom:8px;display:flex;flex-direction:column;gap:6px}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45}
  .log time{font-family:ui-monospace,Consolas,monospace;color:var(--muted);margin-right:6px}
  .houses div{display:flex;justify-content:space-between;gap:8px;line-height:1.45}
  .houses b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%}
  .houses span{color:var(--muted);white-space:nowrap}
  .btn{pointer-events:auto;cursor:pointer;border:0;background:var(--hud);color:var(--ink);border-radius:8px;padding:6px 9px;font:inherit}
  .err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#123;font-size:14px;padding:24px;text-align:center}
</style>
</head>
<body>
<div class="hud top">
  <div class="pill"><div class="title">AGENT TOWN</div><div class="mode" id="mode">กำลังเริ่ม…</div></div>
  <div style="display:flex;gap:6px">
    <span id="lineupCtl" style="display:none;gap:6px">
      <button class="btn" id="lPrev" type="button" title="ท่าก่อนหน้า">◀</button>
      <button class="btn" id="lPlay" type="button" title="หยุด / เล่นต่อ">⏸</button>
      <button class="btn" id="lNext" type="button" title="ท่าถัดไป">▶</button>
    </span>
    <button class="btn" id="lineup" type="button" title="Lineup: ตัวละครเรียงแถว">🧍</button>
    <button class="btn" id="night" type="button">🌙</button>
    <button class="btn" id="cam" type="button">⟲</button>
  </div>
</div>
<div class="hud bottom">
  <div class="pill houses" id="houses" hidden></div>
  <div class="pill log" id="log"></div>
</div>
<div class="err" id="err">โหลด three.js ไม่ได้ — ต้องต่ออินเทอร์เน็ตครั้งแรกเพื่อโหลดไลบรารี</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
"use strict";
if (!window.THREE) { document.getElementById("err").style.display = "flex"; throw new Error("no three"); }

// ── Roles: one look per agent type ─────────────────────────────────────────────────────────────────────────
const ROLES = {
  foreman:  { label: "Main",           body: 0x2f6fa8, trim: 0xf2f5f8, station: [0, 0] },
  planner:  { label: "Planner",        body: 0xf0f3f6, trim: 0x39c6e6, station: [-7, -3], float: true },
  builder:  { label: "Builder",        body: 0xd23a2e, trim: 0xf2b134, station: [5, -6] },
  heavy:    { label: "Heavy Builder",  body: 0x6d3fb3, trim: 0xd9a52c, station: [7, -4] },
  carrier:  { label: "Carrier",        body: 0xe0b33a, trim: 0xd9dde2, station: [6, 5] },
  inspector:{ label: "Inspector",      body: 0x3fae55, trim: 0xe9eef2, station: [-6, 5] },
  tester:   { label: "Tester",         body: 0x23a3a0, trim: 0xe9eef2, station: [-3, 7] },
  scout:    { label: "Scout",          body: 0x2c7fd4, trim: 0xf08a24, station: [3, 7] },
  migrator: { label: "Migrator",       body: 0x7a4bc4, trim: 0xd9dde2, station: [-10, -5.5] },   // ae49-migrate (owner Q2 a, 2026-11-07); moved off the main building's ground (Q17 b)
};
function roleOf(type) {
  type = String(type || "").toLowerCase();
  if (type.includes("heavy")) return "heavy";
  if (type.includes("migrate")) return "migrator";
  if (type.includes("implement-docs") || type.includes("excel")) return "carrier";
  if (type.includes("implement")) return "builder";
  if (type.includes("audit") || type.includes("review")) return "inspector";
  if (type.includes("gate")) return "tester";
  if (type.includes("plan")) return "planner";
  if (type.includes("explore") || type.includes("fetch") || type.includes("guide")) return "scout";
  return "builder";
}

// The lineup preset (owner 2026-11-07): `?lineup` reads no events and lines every role up instead (see "Lineup").
const LINEUP = new URLSearchParams(location.search).has("lineup");

// ── Scene ──────────────────────────────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.5, 200);
const HOME_CAM = new THREE.Vector3(40, 50, 56);   // backed off for the re-laid plots (2026-11-07): all twelve in view
camera.position.copy(HOME_CAM);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 1); controls.enableDamping = true; controls.maxPolarAngle = 1.35; controls.minDistance = 12; controls.maxDistance = 120;
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const hemi = new THREE.HemisphereLight(0xdfefff, 0x6b8a4f, 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dc, 0.9); sun.position.set(14, 26, 10); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22 });
scene.add(sun);
// A cool rim light from behind the robots (the camera looks from +Z), so a dark model's outline lifts off the ground
// (owner 2026-11-07, Q4 a). Low (about 9° up), so it grazes silhouettes and barely lights the ground or roofs, and
// leaves the sun's shadows and the night dark. No shadow: the sun casts them.
const rim = new THREE.DirectionalLight(0xcfe3ff, 0.45); rim.position.set(-12, 3.5, -18); scene.add(rim);

const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, metalness: 0.1, ...o });
const box = (w, h, d, m) => { const x = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); x.castShadow = x.receiveShadow = true; return x; };
const cyl = (rt, rb, h, m, s = 12) => { const x = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, s), m); x.castShadow = true; return x; };
const sph = (r, m) => { const x = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), m); x.castShadow = true; return x; };
const emissives = [];  // lamps / windows / eyes that glow at night

// Ground + roads (a cross through the plaza, a ring road)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), M(0x7fb069)); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const roadM = M(0xc9b48a, { roughness: 0.95 });
// the north ring road and the cross road stop at the main building (it stands across both, owner Q17 b)
for (const [w, d, x, z] of [[44, 2.2, 0, 0], [2.2, 22 + 4.2, 0, 22 - (22 + 4.2) / 2], [2.2, 22 - 15, 0, -15 - (22 - 15) / 2], [10, 1.6, -10, -11], [10, 1.6, 10, -11], [30, 1.6, 0, 12], [1.6, 23, -15, 0.5], [1.6, 23, 15, 0.5]]) {
  const r = box(w, 0.06, d, roadM); r.position.set(x, 0.03, z); r.castShadow = false; scene.add(r);
}
const plaza = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 0.08, 32), M(0xd9cba6)); plaza.position.y = 0.04; plaza.receiveShadow = true; scene.add(plaza);

// Stations
// Lamp posts (owner 2026-11-07): the owner's Tripo lamp (`models/lamp-post.glb`) replaces the code pole and bulb once loaded,
// LAMP_H tall (taller than a robot). Its lantern glows at night (owner: "ให้ไฟสว่างจากตัวหลอดด้านบน", no round code bulb):
// once per file the triangles of its light panel move into a second material group that glows: a street lamp whose arm
// carries the panel on the UNDERSIDE of its far end (owner: "ไฟต้องออกมาจากส่วนปลายเท่านั้น ด้านใต้"), so a triangle
// glows when it is in the head band (LAMP_GLOW, shares of the height), faces down, and lies in the outer part of the
// arm's reach from the pole (LAMP_REACH, share of the farthest head point's distance). Loaded a tick later, like the trees.
const LAMP_H = 3.6, LAMP_GLOW = [0.9, 1.01], LAMP_REACH = 0.55;
let lampGlowM = null;
function prepareLamp(m) {   // once: split the lantern band into its own glowing material
  if (lampGlowM) return;
  m.traverse((o) => {
    if (!o.isMesh || lampGlowM) return;
    const g = o.geometry, pos = g.attributes.position, idx = g.index; if (!idx) return;
    g.computeBoundingBox(); const y0 = g.boundingBox.min.y, hgt = g.boundingBox.max.y - y0;
    let px = 0, pz = 0, pn = 0, far = 0;   // the pole's axis: the mean of the vertices in the lower half
    for (let i = 0; i < pos.count; i++) if ((pos.getY(i) - y0) / hgt < 0.5) { px += pos.getX(i); pz += pos.getZ(i); pn++; }
    px /= pn || 1; pz /= pn || 1;
    for (let i = 0; i < pos.count; i++) if ((pos.getY(i) - y0) / hgt > LAMP_GLOW[0]) far = Math.max(far, Math.hypot(pos.getX(i) - px, pos.getZ(i) - pz));
    const body = [], glow = [], A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3(), N = new THREE.Vector3();
    for (let i = 0; i < idx.count; i += 3) {
      const ia = idx.getX(i), ib = idx.getX(i + 1), ic = idx.getX(i + 2);
      A.fromBufferAttribute(pos, ia); B.fromBufferAttribute(pos, ib); C.fromBufferAttribute(pos, ic);
      const cx = (A.x + B.x + C.x) / 3, cy = (A.y + B.y + C.y) / 3, cz = (A.z + B.z + C.z) / 3, u = (cy - y0) / hgt;
      N.subVectors(B, A).cross(C.clone().sub(A)).normalize();   // its outward face normal (glTF winding is counter-clockwise)
      const down = N.y < -0.7, out = Math.hypot(cx - px, cz - pz) > far * LAMP_REACH;
      (u >= LAMP_GLOW[0] && u <= LAMP_GLOW[1] && down && out ? glow : body).push(ia, ib, ic);
    }
    g.setIndex(body.concat(glow)); g.clearGroups(); g.addGroup(0, body.length, 0); g.addGroup(body.length, glow.length, 1);
    lampGlowM = o.material.clone(); lampGlowM.metalness = 0.2; lampGlowM.emissive = new THREE.Color(0xfff1c8); lampGlowM.emissiveMap = null;
    lampGlowM.emissiveIntensity = night ? 1.1 : 0; emissives.push(lampGlowM);
    o.material.metalness = 0.2; o.material = [o.material, lampGlowM];
  });
}
function lampPost(x, z) {
  const g = new THREE.Group(); g.add(cyl(0.06, 0.08, 2.4, M(0x37424d))); g.children[0].position.y = 1.2;
  const bulbM = M(0xfff1b8, { emissive: 0xffd36b, emissiveIntensity: 0 }); emissives.push(bulbM);
  const b = sph(0.2, bulbM); b.position.y = 2.5; g.add(b); g.position.set(x, 0, z); scene.add(g);
  setTimeout(() => loadModel("models/lamp-post.glb").then((m) => {
    prepareLamp(m);
    const bb = new THREE.Box3().setFromObject(m), k = LAMP_H / (bb.max.y - bb.min.y), lm = m.clone(true);   // shares the lamp materials
    lm.scale.setScalar(k); lm.position.y = -bb.min.y * k; g.clear(); g.add(lm);
    // the head reaches toward the model's −x: turn each lamp so it reaches over the plaza (toward the seats)
    const dx = SEAT_C.x - x, dz = SEAT_C.z - z, n = Math.hypot(dx, dz) || 1; lm.rotation.y = Math.atan2(dz / n, -dx / n);
    const i = emissives.indexOf(bulbM); if (i >= 0) emissives.splice(i, 1);   // the code bulb is gone
  }).catch((e) => console.warn("lamp", e.message)), 0);
}
// Trees (owner 2026-11-07): the owner's Tripo trees replace the code cones once loaded (the cone stays only until then or
// if a file fails). Each tree takes the next model in turn, a turn of its own, and a height of TREE_H × its size —
// taller than a robot (about 2.04), like the buildings. loadModel is called a tick later: this runs before it is defined.
const TREE_URLS = ["models/tree-1.glb", "models/tree-2.glb", "models/tree-3.glb"], TREE_H = 4.4;
let treeCount = 0;
function tree(x, z, s = 1) {
  const g = new THREE.Group(); const t = cyl(0.12 * s, 0.18 * s, 1 * s, M(0x7a5233)); t.position.y = 0.5 * s; g.add(t);
  const c = new THREE.Mesh(new THREE.ConeGeometry(0.9 * s, 1.8 * s, 9), M(0x3f8a4a)); c.position.y = 1.7 * s; c.castShadow = true; g.add(c);
  g.position.set(x, 0, z); scene.add(g);
  const url = TREE_URLS[treeCount++ % TREE_URLS.length], turn = (x * 7.3 + z * 3.1) % (Math.PI * 2);
  setTimeout(() => loadModel(url).then((m) => {
    const bb = new THREE.Box3().setFromObject(m), k = (TREE_H * s) / (bb.max.y - bb.min.y), tm = m.clone(true);
    tm.traverse((o) => { if (o.isMesh) { o.material = o.material.clone(); o.material.metalness = 0; } });
    tm.scale.setScalar(k); tm.position.y = -bb.min.y * k; tm.rotation.y = turn; g.clear(); g.add(tm);
  }).catch((e) => console.warn("tree", url, e.message)), 0);
}
// The site office, the town hall and the Inspector's and Tester's booths were boxes; since 2026-11-07 they are the owner's
// buildings (owner: "ทำไมมันยังมีอาคารเหลี่ยมๆอยู่ … แทนด้วยอาคารที่ผมให้ไป"). These functions keep their signs, pole and
// flag; `landmark` (after BUILDINGS, below) puts the building in each group once it has loaded.
const landmarkGroups = {};
// The main building (owner Q17 b, 2026-11-07): the office, 2 × a house (MAIN_SCALE), moved north to MAIN_Z; the roads under
// it are cut. Everyone rests in front of it facing Main, who sits at its door facing them.
const MAIN_Z = -9.5, MAIN_SCALE = 2, MAIN_SEAT = new THREE.Vector3(0, 0, -3.6);
function office() {  // the Foreman's site office, north of the plaza
  const g = new THREE.Group();
  const sign = labelSprite("SITE OFFICE", "#2f6fa8"); sign.position.set(0, 2.9, 0); sign.scale.set(2.6, 0.65, 1); g.add(sign); g.userData.sign = sign;
  g.position.set(0, 0, MAIN_Z); scene.add(g); landmarkGroups.office = g;
}
// Boxes (owner 2026-11-07): the owner's cardboard box on a pallet (`models/box.glb`, ONE mesh: box and pallet together)
// replaces the code crates at the Carrier's station and on the Builder's and Heavy's tables. A box on the ground keeps its
// pallet; a box stacked on another or standing on a table loses it (owner Q19 a): once per file, its triangles below
// BOX_PALLET (the pallet's deck top, in the file's units) are dropped and those crossing it are cut at it. BOX_W/H/D are the
// file's size (x, height, z; the long side is z), so a stack is laid out before the file loads; each box is sized by its
// long side `len` and turned a little. The code box stands in until the file loads, or if it fails. Loaded a tick later.
const BOX_W = 0.652, BOX_H = 0.740, BOX_D = 0.977, BOX_PALLET = 0.102;
const crateH = (len, pallet) => (len / BOX_D) * (pallet ? BOX_H : BOX_H - BOX_PALLET);
let bareBoxModel = null;
function bareBox(m) {   // once: a copy of the box with the pallet cut away, its foot at y 0
  if (bareBoxModel) return bareBoxModel;
  bareBoxModel = m.clone(true);
  bareBoxModel.traverse((o) => {
    if (!o.isMesh) return;
    const src = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone(), pos = src.attributes.position, keep = [];
    for (let i = 0; i < pos.count; i += 3) if (Math.max(pos.getY(i), pos.getY(i + 1), pos.getY(i + 2)) > BOX_PALLET + 0.002) keep.push(i);
    const g = new THREE.BufferGeometry();
    for (const [name, a] of Object.entries(src.attributes)) {
      const out = new Float32Array(keep.length * 3 * a.itemSize);
      keep.forEach((t, n) => { for (let v = 0; v < 3; v++) for (let c = 0; c < a.itemSize; c++) out[(n * 3 + v) * a.itemSize + c] = a.array[(t + v) * a.itemSize + c]; });
      g.setAttribute(name, new THREE.BufferAttribute(out, a.itemSize));
    }
    const p = g.attributes.position;   // a side face that reached into the pallet now starts at the deck top
    for (let i = 0; i < p.count; i++) p.setY(i, Math.max(p.getY(i), BOX_PALLET) - BOX_PALLET);
    g.computeVertexNormals(); o.geometry = g;
  });
  return bareBoxModel;
}
let boxMat = null;
function crate(len, pallet, x, y, z, turn = 0) {   // a Group whose origin is the box's foot
  const g = new THREE.Group(), s = len / BOX_D, h = crateH(len, pallet);
  const c = box(BOX_W * s, h, len, M(pallet ? 0xc28b4a : 0xb17a3c)); c.position.y = h / 2; g.add(c);
  g.position.set(x, y, z); g.rotation.y = turn;
  setTimeout(() => loadModel("models/box.glb").then((m) => {
    if (!boxMat) m.traverse((o) => { if (o.isMesh && !boxMat) { boxMat = o.material.clone(); boxMat.metalness = 0; } });   // cardboard, not metal
    const bm = (pallet ? m : bareBox(m)).clone(true);
    bm.traverse((o) => { if (o.isMesh) { o.material = boxMat; o.castShadow = o.receiveShadow = true; } });
    bm.scale.setScalar(s); g.clear(); g.add(bm);
  }).catch((e) => console.warn("box", e.message)), 0);
  return g;
}
function stationProp(role) {
  const [x, z] = ROLES[role].station; const g = new THREE.Group();
  if (role === "planner")   { const t = box(1.6, 0.08, 1, M(0xe8e1cf)); t.position.y = 0.9; t.rotation.x = -0.3; g.add(t); for (const s of [-0.7, 0.7]) { const l = cyl(0.04, 0.04, 0.9, M(0x6b5a44)); l.position.set(s, 0.45, 0); g.add(l); } }
  if (role === "builder" || role === "heavy") {   // the work table: a box on it, a smaller one on top (no pallets, Q19 a)
    const t = box(1.6, 0.8, 0.8, M(0x8d6a45)); t.position.y = 0.4; g.add(t);
    g.add(crate(0.62, false, 0.45, 0.8, 0, 0.1)); g.add(crate(0.42, false, 0.47, 0.8 + crateH(0.62, false), 0, -0.3));
  }
  if (role === "carrier") {   // three pallets in a row; bare boxes stacked on them (Q19 a), sizes and turns varied
    const row = [[0.85, -0.66, 0.06], [0.8, 0, -0.04], [0.9, 0.66, 0.09]];
    for (const [len, bx, turn] of row) g.add(crate(len, true, bx, 0, 0, turn));
    const top0 = crateH(0.85, true), top1 = crateH(0.8, true);
    g.add(crate(0.6, false, -0.66, top0, 0.02, -0.15));
    g.add(crate(0.65, false, 0, top1, -0.02, 0.25));
    g.add(crate(0.45, false, 0.02, top1 + crateH(0.65, false), 0, 0.4));
  }
  if (role === "migrator")  { for (let i = 0; i < 3; i++) { const d = cyl(0.42, 0.42, 0.3, M(i % 2 ? 0x9a72d8 : 0x7a4bc4), 20); d.position.y = 0.16 + i * 0.34; g.add(d); } }   // a stack of data drums
  if (role === "scout")     { const f = cyl(0.05, 0.05, 2.2, M(0x37424d)); f.position.y = 1.1; g.add(f); const fl = box(0.8, 0.45, 0.02, M(0xf08a24)); fl.position.set(0.42, 1.95, 0); g.add(fl); }
  g.position.set(x + (x > 0 ? 1.4 : -1.4), 0, z); scene.add(g);
}
function townHall() {
  const g = new THREE.Group();
  const pole = cyl(0.05, 0.05, 3, M(0x37424d)); pole.position.set(2.6, 1.5, 1.6); g.add(pole);
  hallFlag = box(0.9, 0.5, 0.02, M(0x5cc08a)); hallFlag.position.set(3.05, 0.6, 1.6); g.add(hallFlag);
  const sign = labelSprite("TOWN HALL · DEPLOY", "#8c4b3a"); sign.position.set(0, 4.6, 0); sign.scale.set(3.4, 0.7, 1); g.add(sign); g.userData.sign = sign;
  g.position.set(0, 0, 15.5); scene.add(g); landmarkGroups.hall = g;
}
let hallFlag;
// The background-shell machine (owner Q25 a / Q26 a, 2026-11-07): a shell started with `run_in_background` runs on its
// own while Main works on, so a machine beside the SITE OFFICE shows it, not a robot: while any runs its gears turn and its
// lamp blinks, with ×N above it; each one that ends pops a ✓. Fed by `bgApply` (below, under "Events → town").
const BG_POS = new THREE.Vector3(-6.6, 0, -8), BG_HALF = 0.75;   // west of the office, its face turned to the plaza
const bgMachine = { gears: [], lampM: null, count: null, check: null, n: 0, doneUntil: 0 };
function machine() {

  s.onload = () => { s.remove(); ingest(window.__AGENT_TOWN_EVENTS || []); };
  s.onerror = () => { s.remove(); if (firstPoll) startDemo(); firstPoll = false; };

function ingest(list) {
  const fresh = list.filter((e) => e.t > lastT);
  if (!fresh.length) { if (firstPoll && !list.length) startDemo(); firstPoll = false; return; }
  if (!live) { stopDemo(); live = true; }
  const catchUp = firstPoll; firstPoll = false;
  for (const e of fresh) apply(e, catchUp);
  lastT = fresh[fresh.length - 1].t;
  document.getElementById("mode").textContent = "LIVE · " + hhmm(lastT) + " น.";
}

  }, 4500);
}
function stopDemo() { if (demoTimer) { clearInterval(demoTimer); demoTimer = null; for (const h of [...houses.values()]) dropHouse(h); houseSerial = 0; } }

// ── HUD ────────────────────────────────────────────────────────────────────────────────────────────────────
function renderHud() {
  const hs = [...houses.values()].sort((a, b) => b.created - a.created).slice(0, 5);
  const el = document.getElementById("houses"); el.hidden = !hs.length;
  el.innerHTML = hs.map((h) => `<div><b>${esc(h.name)}</b><span>${h.inspecting ? "กำลังตรวจ" : STAGES[h.stage]}</span></div>`).join("");
  document.getElementById("log").innerHTML = logLines.map(([t, x]) => `<div><time>${hhmm(t)}</time>${esc(x)}</div>`).join("") || "<div>รอเหตุการณ์…</div>";
}
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
renderHud();

// ── Day / night ────────────────────────────────────────────────────────────────────────────────────────────
let night = (() => { const h = new Date().getHours(); return h >= 18 || h < 6; })();
function applySky() {
  scene.background = new THREE.Color(night ? 0x0f1b2e : 0x9fc6e6);
  scene.fog = new THREE.Fog(scene.background, 95, 170);   // past the farthest plot from the home camera
  hemi.intensity = night ? 0.28 : 0.75; sun.intensity = night ? 0.18 : 0.9; sun.color.set(night ? 0x8fa8ff : 0xfff2dc);
  rim.intensity = night ? 0.13 : 0.45;   // under the night sun, so walls facing it stay dark
  for (const m of emissives) m.emissiveIntensity = night ? 1.1 : (m.userData.dayGlow ?? (m.emissive && m.color.getHex() === 0x0c1a24 ? 0.9 : 0));
  document.getElementById("night").textContent = night ? "☀️" : "🌙";
}
applySky();
document.getElementById("night").onclick = () => { night = !night; applySky(); if (LINEUP) lineupFog(); };  // applySky makes a new fog
document.getElementById("cam").onclick = () => {
  if (LINEUP) { camera.position.copy(LINEUP_CAM); controls.target.copy(LINEUP_TARGET); } else { camera.position.copy(HOME_CAM); controls.target.set(0, 0, 1); }
};

// ── Lineup (owner 2026-11-07): every role in one row facing the camera, all in the same state, stepping through every
//    state every LINEUP_HOLD s (◀ ⏸ ▶ step by hand). A preset to check models and clips side by side; 🧍 toggles it.
const LINEUP_STEPS = [["idle", "ยืนรอ"], ["walk", "เดิน"], ["work", "ทำงาน · ท่า 1", 0], ["work", "ทำงาน · ท่า 2", 1],
  ["question", "รอคุณตอบ"], ["alarm", "เจอปัญหา"], ["wave", "ทักทาย"], ["celebrate", "ฉลอง"], ["sleep", "พัก"]];
const LINEUP_CAM = new THREE.Vector3(0, 6, 25), LINEUP_TARGET = new THREE.Vector3(0, 1.2, 4), LINEUP_HOLD = 6;
const lineup = { step: 0, since: 0, paused: false };
function lineupShow(i) {
  lineup.step = (i + LINEUP_STEPS.length) % LINEUP_STEPS.length; lineup.since = now();
  const [st, label, pick] = LINEUP_STEPS[lineup.step];
  for (const a of new Set(agents.values())) { a.state = st; a.pick = pick; }
  document.getElementById("mode").textContent = `LINEUP · ท่า ${lineup.step + 1}/${LINEUP_STEPS.length}: ${label}${lineup.paused ? " · หยุดอยู่" : ""}`;
}
function lineupFrame() {  // back the camera off until the whole row fits the pane's width (a narrow pane included)
  const d = Math.max(14, lineup.half / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect));
  LINEUP_CAM.set(0, LINEUP_TARGET.y + d * 0.22, LINEUP_TARGET.z + d);
  controls.maxDistance = Math.max(70, d * 1.5); camera.position.copy(LINEUP_CAM); controls.target.copy(LINEUP_TARGET);
  lineupFog();
}
function lineupFog() {  // the fog starts past the farthest the camera may zoom out, so the row never fades; it still hides
  const far = Math.min(controls.maxDistance + 65, camera.far - 5);   // the ground's edge before the far plane cuts it
  scene.fog.near = Math.min(controls.maxDistance + 5, far - 20); scene.fog.far = far;
}
if (LINEUP) {
  const roles = Object.keys(ROLES), gap = 2.4, keep = new Set([hemi, sun, ground]);
  roles.forEach((role, i) => {
    const a = agents.get(role === "foreman" ? "main" : "res:" + role);
    a.lineup = true; a.home = new THREE.Vector3((i - (roles.length - 1) / 2) * gap, 0, 4);
    a.group.position.copy(a.home); a.group.rotation.y = 0; keep.add(a.group);
    const tag = labelSprite(ROLES[role].label); tag.scale.set(2.1, 0.52, 1); tag.position.set(a.home.x, 0.3, a.home.z + 1.2); scene.add(tag); keep.add(tag);
  });
  for (const c of scene.children) if (!keep.has(c) && !c.isLight) c.visible = false;   // an empty stage: no buildings, roads or props
  ground.scale.set(5, 5, 1);                                                            // and no ground edge, however far the camera backs off
  lineup.half = ((roles.length - 1) / 2) * gap + 1.4;
  lineupFrame(); addEventListener("resize", lineupFrame);
  document.querySelector(".hud.bottom").style.display = "none";
  document.getElementById("lineupCtl").style.display = "flex";
  document.getElementById("lPrev").onclick = () => lineupShow(lineup.step - 1);
  document.getElementById("lNext").onclick = () => lineupShow(lineup.step + 1);
  document.getElementById("lPlay").onclick = (e) => { lineup.paused = !lineup.paused; e.currentTarget.textContent = lineup.paused ? "⏵" : "⏸"; lineupShow(lineup.step); };
  lineupShow(0);
}
document.getElementById("lineup").onclick = () => { location.search = LINEUP ? "" : "?lineup"; };

// ── Animation loop (paused while the pane is hidden) ───────────────────────────────────────────────────────
let prev = now();
// The town draws at most FPS frames a second (owner 2026-11-07: "ถ้าเยอะก็ลดเลย"): measured on this machine, the town at 60
// added about 8 % GPU and 8 % CPU over no town, at 30 about 3 % and 2–3 %, and the motion looks the same. `?fps=60` compares.
// The frame is timed by the refresh's own timestamp (same clock as now()), so a callback that starts late skips nothing;
// the camera's drift after a drag is set per frame, so it lasts as long as it did at 60; `?fps=` is held to 10–240.
const FPS = THREE.MathUtils.clamp(+(new URLSearchParams(location.search).get("fps")) || 30, 10, 240);
controls.dampingFactor = 1 - Math.pow(1 - 0.05, 60 / FPS);   // 0.05 per frame at 60 (the default) → the same per second
function tick(ts) {
  const t = ts === undefined ? now() : ts / 1000;
  if (document.hidden) { prev = t; return requestAnimationFrame(tick); }
  if (t - prev < 1 / FPS - 0.004) return requestAnimationFrame(tick);   // too soon: skip this screen refresh
  const dt = Math.min(Math.max(0.05, 1.5 / FPS), t - prev); prev = t;
  if (LINEUP && !lineup.paused && t - lineup.since > LINEUP_HOLD) lineupShow(lineup.step + 1);
  for (const a of new Set(agents.values())) animate(a, t, dt);
  for (const h of houses.values()) if (h.buildingInfo) driveBuilding(h, dt);
  driveMachine(t, dt);
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.userData.life -= dt; p.userData.v.y -= 6 * dt * (p.geometry.type === "PlaneGeometry" ? 1 : 0); p.position.addScaledVector(p.userData.v, dt); p.rotation.x += dt * 5;
    if (p.material.opacity !== undefined && p.geometry.type !== "PlaneGeometry") p.material.opacity = Math.max(0, p.userData.life);
    if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); } }
  if (hallFlag && hallFlag.userData.raise) { hallFlag.position.y = Math.min(2.8, hallFlag.position.y + dt * 1.2); if (hallFlag.position.y >= 2.8) setTimeout(() => { hallFlag.position.y = 0.6; }, 8000), hallFlag.userData.raise = 0; }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(tick);
}
function animate(a, t, dt) {
  const p = a.parts, g = a.group, R = ROLES[a.role];
  if (a.lineup) { /* the lineup sets the state: no timers, no walking off */ }
  else if (a.state !== "walk" && a.until && t > a.until) { a.until = 0; const f = a.after; a.after = null; if (f) f(); }
  if (a.lineup) { /* stays in its place */ }
  else if (a.state === "walk") {
    const d = new THREE.Vector3().subVectors(a.target, g.position); d.y = 0; const dist = d.length();
    if (dist < 0.08 && a.path && a.path.length) { g.position.copy(a.target); a.target = a.path.shift().clone(); }   // a waypoint: walk on
    else if (dist < 0.08) { g.position.copy(a.target); a.state = a.next || "idle"; if (a.holdOnArrive) { a.until = t + a.holdOnArrive; a.holdOnArrive = 0; } if (a.retire) { scene.remove(g); for (const [k, v] of agents) if (v === a) agents.delete(k); } }
    else { d.normalize(); g.position.addScaledVector(d, Math.min(dist, (a.role === "scout" ? 4.2 : 2.6) * dt)); g.rotation.y = Math.atan2(d.x, d.z); }
  } else if (a.state === "work" && a.house) { const c = plotPos(a.house); g.rotation.y = Math.atan2(c.x - g.position.x, c.z - g.position.z); }
  else if (a.state === "sleep" && g.position.distanceTo(a.home) < 0.1) {   // seated: Main faces its audience, the others face Main
    const to = a.id === "main" ? MAIN_SEAT.clone().add(new THREE.Vector3(0, 0, 3)) : MAIN_SEAT; g.rotation.y = Math.atan2(to.x - g.position.x, to.z - g.position.z);
  }
  else if (a.state === "celebrate" && a.id !== "main" && g.position.distanceTo(MAIN_SEAT) < 3) g.rotation.y = Math.atan2(MAIN_SEAT.x - g.position.x, MAIN_SEAT.z - g.position.z);   // reporting: face Main
  const st = a.state, w = t * 8;
  p.body.position.y = 0; p.body.rotation.set(0, 0, 0);
  p.legs.forEach((l, i) => { l.rotation.x = st === "walk" ? Math.sin(w + i * Math.PI) * 0.6 : st === "sleep" ? -1.3 : 0; });
  p.arms.forEach((ar, i) => { ar.rotation.set(0, 0, 0);
    if (st === "walk") ar.rotation.x = Math.sin(w + i * Math.PI + Math.PI) * 0.5;
    if (st === "work") ar.rotation.x = -0.9 + Math.sin(t * 10 + i) * (i % 2 ? 0.7 : 0.25);
    if (st === "celebrate" || st === "wave") { ar.rotation.z = (i % 2 ? 1 : -1) * (st === "wave" && i % 2 === 0 ? 0.2 : 2.6) + (st === "wave" ? Math.sin(t * 12) * 0.3 : 0); }
    if (st === "alarm") ar.rotation.x = i % 2 ? -1.5 : 0;
    if (st === "sleep") ar.rotation.x = -0.4; });
  if (st === "walk") p.body.position.y = Math.abs(Math.sin(w)) * 0.08;
  if (st === "idle") p.body.position.y = Math.sin(t * 2) * 0.03;
  if (st === "celebrate") p.body.position.y = Math.abs(Math.sin(t * 7)) * 0.6;
  if (st === "alarm") p.body.position.x = Math.sin(t * 40) * 0.05;
  if (st === "sleep") p.body.position.y = R.float ? -0.25 : -0.45;
  if (R.float) p.body.position.y += 0.35 + Math.sin(t * 2.4) * 0.12;
  if (p.flames) p.flames.forEach((f) => { f.visible = st !== "sleep"; f.scale.y = st === "walk" ? 1 + Math.random() * 0.6 : 0.3; });   // off while asleep
  if (p.thruster) p.thruster.scale.setScalar(0.85 + Math.sin(t * 9) * 0.12);
  if (p.holo) p.holo.material.opacity = st === "work" ? 0.45 + Math.sin(t * 6) * 0.15 : 0.15;
  if (p.beacon) p.beacon.material.emissiveIntensity = st === "work" || st === "walk" ? 0.6 + Math.abs(Math.sin(t * 5)) : 0.3;
  setBubble(a, st === "sleep" ? "Zz" : st === "alarm" ? "!" : st === "celebrate" ? "✓" : st === "question" ? "?" : null);
  if (p.bubble.visible) p.bubble.position.y = (p.bubbleY || 3) + Math.sin(t * 2) * 0.1;
  if (p.anim) playClip(p.anim, st, t, dt, a.pick); else if (p.rig) rigPose(p.rig, st, t);
  if (p.anim && p.skin && !p.spiderLegs) driveSitLift(p, t, dt);
  if (p.carry) driveCarry(a, st);
  if (p.rotor) driveRotor(p, st, dt);
  if (p.cape) driveCape(p.cape, st, t, dt);
  if (p.spiderLegs?.length) driveSpiderLegs(p, st, t, dt, p.anim?.current?.time);
  if (st === "work" && a.house && (a.role === "builder" || a.role === "heavy") && Math.random() < dt * 3) dust(g.position);
}
tick();
</script>
</body>
