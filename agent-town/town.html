<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Town</title>
<style>
  :root{--hud:#0f1720cc;--ink:#eef3f7;--muted:#a9b6c2;--accent:#6aa8de;--good:#5cc08a;--warn:#e2ac43;--bad:#e8705c}
  html,body{margin:0;height:100%;background:#9fc6e6;overflow:hidden;font-family:"Sarabun",ui-sans-serif,system-ui,sans-serif}
  canvas{display:block}
  .hud{position:fixed;left:8px;right:8px;pointer-events:none;color:var(--ink);font-size:12px}
  .top{top:8px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .pill{background:var(--hud);border-radius:8px;padding:6px 9px;backdrop-filter:blur(3px)}
  .title{font-weight:700;letter-spacing:.04em}
  .mode{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}
  .bottom{bottom:8px;display:flex;flex-direction:column;gap:6px}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45}
  .log time{font-family:ui-monospace,Consolas,monospace;color:var(--muted);margin-right:6px}
  .houses div{display:flex;justify-content:space-between;gap:8px;line-height:1.45}
  .houses b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%}
  .houses span{color:var(--muted);white-space:nowrap}
  .btn{pointer-events:auto;cursor:pointer;border:0;background:var(--hud);color:var(--ink);border-radius:8px;padding:6px 9px;font:inherit}
  .err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#123;font-size:14px;padding:24px;text-align:center}
</style>
</head>
<body>
<div class="hud top">
  <div class="pill"><div class="title">AGENT TOWN</div><div class="mode" id="mode">กำลังเริ่ม…</div></div>
  <div style="display:flex;gap:6px">
    <span id="lineupCtl" style="display:none;gap:6px">
      <button class="btn" id="lPrev" type="button" title="ท่าก่อนหน้า">◀</button>
      <button class="btn" id="lPlay" type="button" title="หยุด / เล่นต่อ">⏸</button>
      <button class="btn" id="lNext" type="button" title="ท่าถัดไป">▶</button>
    </span>
    <button class="btn" id="lineup" type="button" title="Lineup: ตัวละครเรียงแถว">🧍</button>
    <button class="btn" id="night" type="button">🌙</button>
    <button class="btn" id="cam" type="button">⟲</button>
  </div>
</div>
<div class="hud bottom">
  <div class="pill houses" id="houses" hidden></div>
  <div class="pill log" id="log"></div>
</div>
<div class="err" id="err">โหลด three.js ไม่ได้ — ต้องต่ออินเทอร์เน็ตครั้งแรกเพื่อโหลดไลบรารี</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
"use strict";
if (!window.THREE) { document.getElementById("err").style.display = "flex"; throw new Error("no three"); }

// ── Roles: one look per agent type ─────────────────────────────────────────────────────────────────────────
const ROLES = {
  foreman:  { label: "Main",           body: 0x2f6fa8, trim: 0xf2f5f8, station: [0, 0] },
  planner:  { label: "Planner",        body: 0xf0f3f6, trim: 0x39c6e6, station: [-7, -3], float: true },
  builder:  { label: "Builder",        body: 0xd23a2e, trim: 0xf2b134, station: [5, -6] },
  heavy:    { label: "Heavy Builder",  body: 0x6d3fb3, trim: 0xd9a52c, station: [7, -4] },
  carrier:  { label: "Carrier",        body: 0xe0b33a, trim: 0xd9dde2, station: [6, 5] },
  inspector:{ label: "Inspector",      body: 0x3fae55, trim: 0xe9eef2, station: [-6, 5] },
  tester:   { label: "Tester",         body: 0x23a3a0, trim: 0xe9eef2, station: [-3, 7] },
  scout:    { label: "Scout",          body: 0x2c7fd4, trim: 0xf08a24, station: [3, 7] },
  migrator: { label: "Migrator",       body: 0x7a4bc4, trim: 0xd9dde2, station: [-4, -6] },   // ae49-migrate (owner Q2 a, 2026-11-07)
};
function roleOf(type) {
  type = String(type || "").toLowerCase();
  if (type.includes("heavy")) return "heavy";
  if (type.includes("migrate")) return "migrator";
  if (type.includes("implement-docs") || type.includes("excel")) return "carrier";
  if (type.includes("implement")) return "builder";
  if (type.includes("audit") || type.includes("review")) return "inspector";
  if (type.includes("gate")) return "tester";
  if (type.includes("plan")) return "planner";
  if (type.includes("explore") || type.includes("fetch") || type.includes("guide")) return "scout";
  return "builder";
}

// The lineup preset (owner 2026-11-07): `?lineup` reads no events and lines every role up instead (see "Lineup").
const LINEUP = new URLSearchParams(location.search).has("lineup");

// ── Scene ──────────────────────────────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.5, 200);
const HOME_CAM = new THREE.Vector3(30, 34, 36);
camera.position.copy(HOME_CAM);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 1); controls.enableDamping = true; controls.maxPolarAngle = 1.35; controls.minDistance = 12; controls.maxDistance = 70;
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const hemi = new THREE.HemisphereLight(0xdfefff, 0x6b8a4f, 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dc, 0.9); sun.position.set(14, 26, 10); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22 });
scene.add(sun);
// A cool rim light from behind the robots (the camera looks from +Z), so a dark model's outline lifts off the ground
// (owner 2026-11-07, Q4 a). Low (about 9° up), so it grazes silhouettes and barely lights the ground or roofs, and
// leaves the sun's shadows and the night dark. No shadow: the sun casts them.
const rim = new THREE.DirectionalLight(0xcfe3ff, 0.45); rim.position.set(-12, 3.5, -18); scene.add(rim);

const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, metalness: 0.1, ...o });
const box = (w, h, d, m) => { const x = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); x.castShadow = x.receiveShadow = true; return x; };
const cyl = (rt, rb, h, m, s = 12) => { const x = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, s), m); x.castShadow = true; return x; };
const sph = (r, m) => { const x = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), m); x.castShadow = true; return x; };
const emissives = [];  // lamps / windows / eyes that glow at night

// Ground + roads (a cross through the plaza, a ring road)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), M(0x7fb069)); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const roadM = M(0xc9b48a, { roughness: 0.95 });
for (const [w, d, x, z] of [[44, 2.2, 0, 0], [2.2, 44, 0, 0], [30, 1.6, 0, -11], [30, 1.6, 0, 12], [1.6, 23, -15, 0.5], [1.6, 23, 15, 0.5]]) {
  const r = box(w, 0.06, d, roadM); r.position.set(x, 0.03, z); r.castShadow = false; scene.add(r);
}
const plaza = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 0.08, 32), M(0xd9cba6)); plaza.position.y = 0.04; plaza.receiveShadow = true; scene.add(plaza);

// Stations
function lampPost(x, z) {
  const g = new THREE.Group(); g.add(cyl(0.06, 0.08, 2.4, M(0x37424d))); g.children[0].position.y = 1.2;
  const bulbM = M(0xfff1b8, { emissive: 0xffd36b, emissiveIntensity: 0 }); emissives.push(bulbM);
  const b = sph(0.2, bulbM); b.position.y = 2.5; g.add(b); g.position.set(x, 0, z); scene.add(g);
}
function tree(x, z, s = 1) {
  const g = new THREE.Group(); const t = cyl(0.12 * s, 0.18 * s, 1 * s, M(0x7a5233)); t.position.y = 0.5 * s; g.add(t);
  const c = new THREE.Mesh(new THREE.ConeGeometry(0.9 * s, 1.8 * s, 9), M(0x3f8a4a)); c.position.y = 1.7 * s; c.castShadow = true; g.add(c);
  g.position.set(x, 0, z); scene.add(g);
}
function office() {  // the Foreman's site office, north of the plaza
  const g = new THREE.Group();
  const b = box(3.4, 2, 2.4, M(0x2f6fa8)); b.position.y = 1; g.add(b);
  const r = box(3.8, 0.25, 2.8, M(0xf2f5f8)); r.position.y = 2.1; g.add(r);
  const winM = M(0xbfe3ff, { emissive: 0xffd36b, emissiveIntensity: 0 }); emissives.push(winM);
  const w = box(1.2, 0.7, 0.05, winM); w.position.set(0.6, 1.2, 1.22); g.add(w);
  const sign = labelSprite("SITE OFFICE", "#2f6fa8"); sign.position.set(0, 2.9, 0); sign.scale.set(2.6, 0.65, 1); g.add(sign);
  g.position.set(0, 0, -4.2); scene.add(g);
}
function stationProp(role) {
  const [x, z] = ROLES[role].station; const g = new THREE.Group();
  if (role === "inspector") { const b = box(1.4, 1.6, 1.2, M(0x3fae55)); b.position.y = 0.8; g.add(b); const r = box(1.6, 0.15, 1.4, M(0xe9eef2)); r.position.y = 1.65; g.add(r); }
  if (role === "tester")    { const b = box(1.8, 1.5, 1.4, M(0x23a3a0)); b.position.y = 0.75; g.add(b); const sM = M(0x0e2a33, { emissive: 0x39e6c6, emissiveIntensity: 0.6 }); const s = box(0.9, 0.5, 0.05, sM); s.position.set(0, 1, 0.72); g.add(s); }
  if (role === "planner")   { const t = box(1.6, 0.08, 1, M(0xe8e1cf)); t.position.y = 0.9; t.rotation.x = -0.3; g.add(t); for (const s of [-0.7, 0.7]) { const l = cyl(0.04, 0.04, 0.9, M(0x6b5a44)); l.position.set(s, 0.45, 0); g.add(l); } }
  if (role === "builder" || role === "heavy") { const t = box(1.6, 0.8, 0.8, M(0x8d6a45)); t.position.y = 0.4; g.add(t); const c = box(0.5, 0.5, 0.5, M(0xc28b4a)); c.position.set(0.5, 1.05, 0); g.add(c); }
  if (role === "carrier")   { for (let i = 0; i < 3; i++) { const c = box(0.6, 0.6, 0.6, M(0xc28b4a)); c.position.set(i * 0.65 - 0.65, 0.3, 0); g.add(c); } const c = box(0.6, 0.6, 0.6, M(0xb17a3c)); c.position.set(0, 0.9, 0); g.add(c); }
  if (role === "migrator")  { for (let i = 0; i < 3; i++) { const d = cyl(0.42, 0.42, 0.3, M(i % 2 ? 0x9a72d8 : 0x7a4bc4), 20); d.position.y = 0.16 + i * 0.34; g.add(d); } }   // a stack of data drums
  if (role === "scout")     { const f = cyl(0.05, 0.05, 2.2, M(0x37424d)); f.position.y = 1.1; g.add(f); const fl = box(0.8, 0.45, 0.02, M(0xf08a24)); fl.position.set(0.42, 1.95, 0); g.add(fl); }
  g.position.set(x + (x > 0 ? 1.4 : -1.4), 0, z); scene.add(g);
}
function townHall() {
  const g = new THREE.Group();
  const b = box(4, 2.6, 2.6, M(0xe7dcc4)); b.position.y = 1.3; g.add(b);
  const r = new THREE.Mesh(new THREE.ConeGeometry(3.2, 1.6, 4), M(0x8c4b3a)); r.rotation.y = Math.PI / 4; r.position.y = 3.4; r.castShadow = true; g.add(r);
  const pole = cyl(0.05, 0.05, 3, M(0x37424d)); pole.position.set(2.6, 1.5, 1.6); g.add(pole);
  hallFlag = box(0.9, 0.5, 0.02, M(0x5cc08a)); hallFlag.position.set(3.05, 0.6, 1.6); g.add(hallFlag);
  const sign = labelSprite("TOWN HALL · DEPLOY", "#8c4b3a"); sign.position.set(0, 4.6, 0); sign.scale.set(3.4, 0.7, 1); g.add(sign);
  g.position.set(0, 0, 15.5); scene.add(g);
}
let hallFlag;

function labelSprite(text, color = "#1d2731", bg = "rgba(255,255,255,.92)") {
  const c = document.createElement("canvas"); c.width = 512; c.height = 128; const x = c.getContext("2d");
  x.fillStyle = bg; x.beginPath(); x.roundRect ? x.roundRect(4, 8, 504, 112, 26) : x.rect(4, 8, 504, 112); x.fill();
  x.fillStyle = color; x.font = "600 54px Sarabun, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
  let t = text; while (x.measureText(t).width > 470 && t.length > 4) t = t.slice(0, -2); if (t !== text) t += "…";
  x.fillText(t, 256, 66);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false, transparent: true }));
  s.renderOrder = 10; return s;
}
function bubble(char) {
  const color = { "!": "#e8705c", "?": "#e2ac43", "Zz": "#6b7c8c", "✓": "#2e8b57" }[char] || "#333";
  const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.beginPath(); x.arc(64, 60, 52, 0, Math.PI * 2); x.fill();
  x.fillStyle = color; x.font = "700 64px sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(char, 64, 62);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false, transparent: true }));
  s.scale.set(0.7, 0.7, 1); s.renderOrder = 11; return s;
}

office(); townHall();
for (const r of Object.keys(ROLES)) if (r !== "foreman") stationProp(r);
for (const [x, z] of [[-3.5, -1.5], [3.5, -1.5], [-3.5, 2.2], [3.5, 2.2], [-15, -11], [15, 12]]) lampPost(x, z);
for (const [x, z, s] of [[-19, -16, 1.2], [-21, 4, 1], [20, -15, 1.1], [21, 3, 0.9], [-12, 17, 1], [12, 18, 1.2], [-20, 17, 0.8], [19, 18, 1], [-9, -16, 0.9], [9, -17, 1]]) tree(x, z, s);

// ── Robots, built from simple shapes ───────────────────────────────────────────────────────────────────────
// ── Real models (owner 2026-11-06): a role listed here wears its .glb once it has loaded; until then, or if it fails,
//    the robot built from shapes stays. Every role's model is rigged now (2026-11-07); the tables below give each its clips or code poses.
const MODEL_URLS = { builder: "models/builder.glb", planner: "models/planner.glb", foreman: "models/main.glb", scout: "models/scout.glb", carrier: "models/carrier.glb", heavy: "models/heavy.glb", inspector: "models/inspector.glb", tester: "models/tester.glb", migrator: "models/migrator.glb" };
// Clips by town state, per role (owner's Tripo exports 2026-11-06 / -07). A state missing here falls back to "idle".
// "work" alternates its list every 8 s. Clips are played in place: the hips' horizontal drift is removed at load.
// A name matches a clip of that exact name, else the first clip whose name STARTS with it (Tripo names a
// Text2Motion clip after its prompt, e.g. "Standing in place, the character extends the right arm forward ").
const CLIP_SET = (point) => ({ idle: ["idle"], walk: ["walk"], work: [point, "Typing / Writing / Using tablet"],
  question: ["Thinking"], celebrate: ["Cheer / Clap"], wave: ["Wave / Nod"], sleep: ["Sit / Sleep"],
  alarm: ["Looking around / Searching"] });
const MODEL_CLIPS = { builder: CLIP_SET("Standing in place"), planner: CLIP_SET("Standing in place"), foreman: CLIP_SET("Standing in place"), scout: CLIP_SET("Standing in place"), carrier: CLIP_SET("Standing in place"), inspector: { ...CLIP_SET("Standing in place"), sleep: ["idle"] }, migrator: CLIP_SET("Standing in place"), heavy: CLIP_SET("Standing in place"), tester: { ...CLIP_SET("Standing in place"), sleep: ["idle"] } };   // tester: the Sit clip would sink the torso into its still base; asleep the legs splay instead
const MODEL_SCALE = { builder: 2.93, planner: 2.5, foreman: 2.5, scout: 2.5, carrier: 2.5, heavy: 3.4, inspector: 2.3, tester: 2.5, migrator: 2.85 };   // heavy.glb is 0.72 tall (the others ~0.97): 3.4 makes it as tall as the rest, and far wider; migrator.glb is 0.84 tall, builder.glb 0.82; inspector.glb 0.84 at 2.3 stands about 80 % as tall (owner: smaller)
// A rigged (skinned) model: cloned with SkeletonUtils, posed by code each frame (rigPose below), turned to face +Z.
// tone: re-grade the base colour once at load (owner 2026-11-07, Q4 a: Main's black read as a silhouette, "ทึบ").
//   lift  raises the darkest tones to this grey (0–255, like Levels' output black) — on colourless pixels only: the lift
//         fades out as the ORIGINAL pixel's colour difference (max − min channel) grows past a small dead zone (JPEG tint
//         noise), so the painted blue lights and the gold keep their own values (a plain lift turned the lights pastel
//         and the gold khaki — audit 2026-11-07);
//   cool  tints the greys (the low-saturation pixels) toward blue by this much, so the grey reads cool, not brown;
//   gold  multiplies the saturation of warm, saturated pixels (the gold trims) and lifts them up to 8 %, eased in from
//         saturation 0.2 to 0.32 so trims get no hard contour; a channel past 255 scales all three down (no hue shift).
const MODEL_RIGGED = { builder: { turn: 0, metalness: 0.25 }, planner: { turn: 0, metalness: 0.25 },
  foreman: { turn: 0, metalness: 0.25, tone: { lift: 40, cool: 10, gold: 1.25 } }, scout: { turn: 0, metalness: 0.25 }, carrier: { turn: 0, metalness: 0.25 }, heavy: { turn: 0, metalness: 0.25 }, inspector: { turn: 0, metalness: 0.25 }, tester: { turn: 0, metalness: 0.25 }, migrator: { turn: 0, metalness: 0.25 } };
// Jet flames drawn by code at a model's nozzles (the owner removed them from the art, 2026-11-07): nozzle centres in
// model units, measured from scout.glb's rest pose (the jetpack's lowest back points, x ±0.06–0.17, y 0.674).
const MODEL_JETS = { scout: [[0.116, 0.672, -0.108], [-0.116, 0.672, -0.108]] };
function addJetFlames(model, parts, nozzles) {  // hung on Spine2, so the flames follow the back when the clips bend it
  let spine; model.traverse((o) => { if (o.isBone && /Spine2$/.test(o.name)) spine = o; });
  if (!spine) return; model.updateMatrixWorld(true);
  const ms = new THREE.Vector3(), bs = new THREE.Vector3(), q = new THREE.Quaternion(), mq = new THREE.Quaternion();
  model.getWorldScale(ms); spine.getWorldScale(bs); spine.getWorldQuaternion(q); model.getWorldQuaternion(mq);
  const fm = M(0xffb347, { emissive: 0xff7a1a, emissiveIntensity: 1.2, transparent: true, opacity: 0.9 });
  parts.flames = nozzles.map(([x, y, z]) => {
    const h = new THREE.Group(); h.position.copy(spine.worldToLocal(model.localToWorld(new THREE.Vector3(x, y, z))));
    h.quaternion.copy(q.clone().invert().multiply(mq)); h.scale.setScalar(ms.x / bs.x);   // model-frame axes and units
    const f = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.14, 10).rotateX(Math.PI).translate(0, -0.07, 0), fm);   // tip down, base at the nozzle, so it scales from there
    h.add(f); spine.add(h); return f;
  });
}
// ── Extra arms (owner Q6 b, 2026-11-07): Heavy Builder has a second, lower pair of arms that no auto-rig gives bones
//    (Tripo rigs two arms; its exporter weighted the lower arms to the UPPER arm bones). At load we give each lower arm
//    a shoulder and an elbow bone, move its skin onto them (blended into the spine at the root so it does not tear), and
//    `driveExtraArms` swings them by state each frame. Points are in model units, measured from heavy.glb's rest pose:
//    the lower-arm skin is the vertices below y 0.505 whose strongest bone is that side's upper arm / forearm / hand.
const MODEL_EXTRA_ARMS = { heavy: { parent: "Spine02", below: 0.505, cap: 0.54, sides: [
  { name: "L", s: 1, owners: /^L_(Upperarm|Forearm|Hand|Thumb|Index|Mid|Ring|Pinky)/, attach: [0.200, 0.470, -0.010], elbow: [0.245, 0.360, -0.008], hand: [0.268, 0.230, -0.005] },
  { name: "R", s: -1, owners: /^R_(Upperarm|Forearm|Hand|Thumb|Index|Mid|Ring|Pinky)/, attach: [-0.200, 0.470, -0.010], elbow: [-0.245, 0.360, -0.008], hand: [-0.268, 0.230, -0.005] },
] } };
const riggedExtra = new WeakSet();
function rigExtraArms(model, cfg) {   // once per loaded file, before any clone: SkeletonUtils.clone copies the new bones
  if (riggedExtra.has(model)) return; riggedExtra.add(model);
  let mesh; model.traverse((o) => { if (o.isSkinnedMesh) mesh = o; });
  const parent = mesh && mesh.skeleton.bones.find((b) => b.name === cfg.parent); if (!parent) return;
  model.updateMatrixWorld(true);
  const toLocal = (b, p) => {   // a new bone at model point p, its axes and units those of the model frame
    const pq = new THREE.Quaternion(), ps = new THREE.Vector3(); b.parent.getWorldQuaternion(pq); b.parent.getWorldScale(ps);
    b.position.copy(b.parent.worldToLocal(model.localToWorld(new THREE.Vector3(...p)))); b.quaternion.copy(pq.invert());
    b.scale.set(1 / ps.x, 1 / ps.y, 1 / ps.z); b.updateMatrixWorld(true);
  };
