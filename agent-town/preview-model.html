<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Preview</title>
<style>
  :root { --bg: #1b2430; --ink: #e9eef2; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px system-ui, sans-serif; overflow: hidden; }
  #label { position: fixed; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-around; pointer-events: none; }
  #label div { background: rgba(0,0,0,.45); padding: 4px 10px; border-radius: 6px; }
  #status { position: fixed; bottom: 10px; left: 12px; }
</style>
</head>
<body>
<div id="label"></div>
<div id="status">loading…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// Side-by-side look at two or more models, e.g. decimated copies of one (agent-town, 2026-11-06). ?models=a.glb,b.glb (under models/).
const names = (new URLSearchParams(location.search).get("models") || "builder.glb,carrier.glb").split(",");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b2430);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(2, 4, 3); scene.add(sun);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
camera.position.set(0, 1.1, 2.6 + names.length * 0.5);
const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.target.set(0, 0.45, 0); controls.update();
const loader = new THREE.GLTFLoader(); const status = document.getElementById("status"); const label = document.getElementById("label");
let done = 0; const spin = [];
names.forEach((n, i) => {
  const d = document.createElement("div"); d.textContent = n; label.appendChild(d);
  const t0 = performance.now();
  loader.load("models/" + n, (g) => {
    const root = g.scene; root.position.x = (i - (names.length - 1) / 2) * 1.2;
    root.traverse((o) => { if (o.isMesh) { o.geometry.computeVertexNormals(); if (o.material.map) o.material.map.encoding = THREE.sRGBEncoding; } });
    scene.add(root); spin.push(root);
    let tris = 0; root.traverse((o) => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
    d.textContent = `${n} · ${Math.round(tris).toLocaleString()} tris · ${Math.round(performance.now() - t0)} ms`;
    status.textContent = ++done === names.length ? "ready — drag to turn" : "loading…";
  }, undefined, (e) => { d.textContent = n + " · FAILED: " + e.message; });
});
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
(function loop(t) { spin.forEach((r) => { r.rotation.y = t / 2500; r.position.y = Math.sin(t / 400) * 0.02; }); renderer.render(scene, camera); requestAnimationFrame(loop); })(0);
</script>
</body>
</html>
